# Cloudflare Worker that adds Markdown content negotiation in front of GitHub Pages (see worker.mjs).
# Needs the www and bare-domain DNS records proxied through Cloudflare. Deploy from this folder: npx wrangler deploy
name = "hazwoperosha-com-edge"
main = "worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = false
routes = [
  { pattern = "www.hazwoperosha.com/*", zone_name = "hazwoperosha.com" },
  { pattern = "hazwoperosha.com/*", zone_name = "hazwoperosha.com" },
]

[vars]
# The site's host (site.config.js url). Requests for the bare domain get a 301 to it.
CANONICAL_HOST = "www.hazwoperosha.com"
