name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/exciting-heisenberg-7wyyfk, claude/ecstatic-clarke-uqa3gz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node tools/build.js
      - name: Assemble publish folder
        run: |
          mkdir _site
          cp -r index.html checkout.html 404.html robots.txt sitemap.xml llms.txt llms-full.txt .nojekyll CNAME assets courses guides quizzes search _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
